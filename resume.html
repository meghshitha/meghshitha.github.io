<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGHA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .nav {
      background: #000;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 60px;
      box-sizing: border-box;
      z-index: 10;
      width: 100vw;
    }
    .nav .name a {
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }
    .nav .name a span {
      color: cyan;
    }
    .info a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }
    .pdf-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: calc(100vh - 60px); /* Adjust if nav height changes */
      box-sizing: border-box;
    }
    .pdf-container embed {
      width: 90vw;
      height: 90vh;
      max-height: calc(100vh - 100px); /* Subtract extra for nav & margin */
      border: 4px solid #333;
      border-radius: 10px;
      background: #fff;
      box-shadow: 15px 10px 20px rgba(0,0,0,0.6);
    }
    @media only screen and (max-width: 600px) {
      .pdf-container embed {
        width: 99vw;
        height: 75vh;
      }
    }
  </style>
</head>
<body>
  <div class="nav">
    <span class="name"><a href="index.html" target="_blank">Megha <span>K</span></a></span>
    <div class="info">
      <div><a href="index.html">Home</a></div>
    </div>
  </div>
  <div class="pdf-container">
    <embed src="./assets/resume.pdf" type="application/pdf"/>
  </div>
</body>
</html>
